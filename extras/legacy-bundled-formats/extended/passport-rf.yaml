name: Паспорт РФ
width_mm: 35
height_mm: 45
head_height_mm: 32
chin_bottom_mm: 7
background: '#FFFFFF'
note: >
  35×45 мм, чёрно-белая или цветная. Анфас, нейтральное выражение, рот закрыт; в кадре голова и верх плеч, от макушки до подбородка — не больше 80 % высоты. Белый ровный фон без полос, пятен, теней и посторонних предметов. Глаза открыты, волосы их не заслоняют. Без головного убора (исключение — религиозные убеждения, овал лица виден). Без форменной и верхней одежды, шарфов на подбородке. Лицо без ретуши и «улучшений», особенности переданы достоверно. Постоянно в очках — снимок в очках: без тонированных стёкол, оправа не закрывает глаза; в цвете — без линз, меняющих цвет глаз. Соответствие возрасту гражданина на день подачи заявления.
