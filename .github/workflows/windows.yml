name: Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: python -m pip install -e . pyinstaller

      - name: Проверить
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python -m unittest discover -s tests

      - name: Собрать
        run: pyinstaller --noconfirm photofordocs.spec

      - name: Упаковать
        run: Compress-Archive -Path dist\photofordocs -DestinationPath photofordocs-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: photofordocs-windows
          path: photofordocs-windows.zip

      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: photofordocs-windows.zip
