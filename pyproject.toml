[project]
name = "photofordocs"
version = "0.1.1"
description = "Локальная подготовка фото на документы"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.6",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "Pillow>=10.3",
  "PyYAML>=6.0",
]

[project.scripts]
photofordocs = "photofordocs.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photofordocs = ["formats/*.yaml", "models/*.onnx"]
